# Sign and publish the plugin to the JetBrains Marketplace.
#
# Required repository secrets:
#   CERTIFICATE_CHAIN      - PEM-encoded certificate chain
#   PRIVATE_KEY            - PEM-encoded (encrypted) private key
#   PRIVATE_KEY_PASSWORD   - passphrase for PRIVATE_KEY
#   PUBLISH_TOKEN          - JetBrains Marketplace Hub permanent token
#
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html
# and https://plugins.jetbrains.com/docs/intellij/deployment.html
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Place secrets
        env:
          CERTIFICATE_CHAIN_BASE64: ${{ secrets.CERTIFICATE_CHAIN_BASE64 }}
          PRIVATE_KEY_BASE64: ${{ secrets.PRIVATE_KEY_BASE64 }}
        run: |
          base64 -d <<< "$CERTIFICATE_CHAIN_BASE64" > "./chain.crt"
          base64 -d <<< "$PRIVATE_KEY_BASE64" > "./private.pem"

      - name: Sign, publish, and patch changelog
        env:
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew verifyPluginSignature publishPlugin patchChangelog -PpluginVersion="${GITHUB_REF_NAME#v}"

      - name: Commit patched CHANGELOG to main
        run: |
          # patchChangelog runs from the tag commit; move the patched file onto
          # main so subsequent releases start from a clean "Unreleased" section.
          cp CHANGELOG.md "${RUNNER_TEMP}/CHANGELOG.md"
          git fetch origin main
          git checkout -B main origin/main
          cp "${RUNNER_TEMP}/CHANGELOG.md" CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "No CHANGELOG changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG for ${GITHUB_REF_NAME}"
          git push origin main

      - name: Clear secrets
        if: always()
        run: rm -f "./chain.crt" "./private.pem"
